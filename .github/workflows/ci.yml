name: Forge CI
on:
  push: { branches: [2.1forge] }
  pull_request: { branches: [2.1forge] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - name: Validate committed wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -x gradlew
          grep -F 'gradle-8.1.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon --console=plain --version
      - name: Clean build and complete regression suite
        run: ./gradlew --no-daemon --console=plain clean check build
      - name: Validate developer documentation
        run: scripts/validate-docs.sh
      - name: Validate primary JAR and print provenance
        run: |
          scripts/validate-artifact.sh forge build/libs/forgewebmap-0.2.1.jar
          sha256sum build/libs/forgewebmap-0.2.1.jar | tee build/libs/forgewebmap-0.2.1.jar.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-ci-artifacts
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/libs/forgewebmap-0.2.1.jar*
          retention-days: 14
